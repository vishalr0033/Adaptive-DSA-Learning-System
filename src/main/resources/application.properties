server.port=8080

# Application info
spring.application.name=AI-DSA-Learning-System

# Primary Database Configuration: MySQL
# (Change username and password to match your local MySQL configuration if needed)
spring.datasource.url=jdbc:mysql://localhost:3306/dsa_learning?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Spring Static Resource handling
spring.web.resources.static-locations=classpath:/static/

# AI Configuration (Environment Variable: GEMINI_API_KEY)
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

# Java Execution Sandbox settings
executor.timeout.seconds=3
executor.max.output.length=5000
