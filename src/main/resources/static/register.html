<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Adaptive DSA Learning System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="app-header"></header>

    <div class="auth-wrapper">
        <div class="auth-card" style="max-width: 520px;">
            <h2 style="font-size: 1.4rem; font-weight: 700; margin-bottom: 0.5rem; color: #fff;">
                Student Registration
            </h2>
            <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 1.5rem;">
                Create your student profile to begin personalized AI mistake analysis
            </p>

            <form id="register-form">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="reg-name" class="form-control" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="john@college.edu" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required minlength="4">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label">College / University</label>
                        <input type="text" id="reg-college" class="form-control" placeholder="MIT / Stanford" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Branch / Department</label>
                        <input type="text" id="reg-branch" class="form-control" placeholder="Computer Science" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Graduation Year</label>
                    <input type="number" id="reg-gradyear" class="form-control" placeholder="2026" min="2020" max="2035" required>
                </div>

                <button type="submit" id="btn-reg-submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                    Complete Registration →
                </button>
            </form>

            <div style="margin-top: 1.5rem; text-align: center; font-size: 0.88rem; color: var(--text-secondary);">
                Already have an account? <a href="/login" style="font-weight: 600;">Sign in here</a>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const college = document.getElementById('reg-college').value.trim();
            const branch = document.getElementById('reg-branch').value.trim();
            const graduationYear = parseInt(document.getElementById('reg-gradyear').value, 10);

            const btn = document.getElementById('btn-reg-submit');
            btn.disabled = true;
            btn.innerText = 'Creating account...';

            try {
                const resp = await App.request('/auth/register', {
                    method: 'POST',
                    body: JSON.stringify({
                        name, email, password, college, branch, graduationYear
                    })
                });

                if (resp.success) {
                    App.setUser(resp);
                    App.showToast('Registration successful! Welcome, ' + resp.name, 'success');
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 500);
                } else {
                    App.showToast(resp.message || 'Registration failed', 'error');
                }
            } catch (err) {
                App.showToast(err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Complete Registration →';
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            App.renderNav();
        });
    </script>
</body>
</html>
